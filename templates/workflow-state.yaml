schema_version: 1
# 仅维护当前流程；历史/授权正文保留在原记录，当前有效授权必须可达。
# 既有字段不能未经读取方兼容检查就删除；可选入口缺失时按 Profile/交接定位。
profile: "profile-id@version"
milestone: "M001"
# 并行需求由创建器添加 workstream: "<slug>"，文件放在该需求 workflow/ 下。
# 单流程不添加；并行项目的此顶层文件只协调里程碑，不覆盖各需求当前阶段。
stage: "product-planning"
active_role: "product/base"
active_agent: "product-maya"
status: "active"

required_artifacts: []
pending_user_decisions: []
open_change_requests: []

# 可选路径/稳定 ID 指针，不复制主文档或另建 STATE/ROADMAP。
context_entries:
  current_handoff: null
  task_index: null
  constraints_index: null
  history_index: null
# 每项记录 id、scope、source；执行相应操作前读取完整来源，引用本身不授予权限。
authorization_refs: []

allowed_transitions:
  - "remain_in_current_stage"

last_transition:
  from: null
  to: "product-planning"
  confirmed_by: "user"
  decision_id: null
  timestamp: "YYYY-MM-DDTHH:MM:SSZ"
